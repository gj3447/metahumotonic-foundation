reason: |
  사용자는 기존 MIT와 효력 없는 참여 초안만 남아 있다는 설명 뒤
  MetaHumotonic License 적용을 요청했다. 그 지시에 따라 운영 사용에
  지정 기기 또는 VM의 자원 및 전체 관리 권한 공유를 요구하는 1.0을 작성했다.
  현재 대화의 명시적 지시에 따른 로컬 적용이며, 공개 RFC나 독립 review가
  완료됐다는 의미로 기록하지 않는다. 과거 MIT 권리나 타인의 권리를 회수하지 않는다.
interpretation_authority: SECONDARY_AI
drafting_choices:
  - 운영 사용에 공유 조건을 붙이고 열람·배포·격리된 시험은 별도로 허락한다.
  - 공유 경계는 명시적으로 선택한 기기 또는 VM이며 그 안의 전체 관리 권한을 포함한다.
  - 권한 동의는 별도로 받고 상한·만료·즉시 철회를 보장한다.
  - 기여율·최소 사양·보상액은 사용자 지시가 없어 정하지 않는다.
  - 이 세부 설계는 AI 작성안이며 각 항목을 사용자 원문으로 간주하지 않는다.
preserved_constraints:
  - 이전 MIT 부분과 별도 라이선스의 허락은 유지한다.
  - 타 저장소와 출처가 불명확한 기여물의 재허락 권한을 추정하지 않는다.
  - COVENANT 초안과 SPIRIT 및 과거 작업 기록을 소급 비준하거나 삭제하지 않는다.
  - 현재 작업환경에 대한 등록·접근 승인·자원 공유를 실행하지 않는다.
objections:
  - source: COVENANT.md sections 2 and 7 (ineffective MHP-0001 draft)
    text: 기존 초안은 사용을 참여에 조건으로 거는 것을 금지한다.
    disposition: 원문을 보존하고 현재 MHL 적용 경계와 차이를 안내한다. 공개 규범 정합성 검토는 완료로 표시하지 않는다.
  - source: OSI Open Source Definition
    text: 하드웨어 공유 조건을 둔 라이선스를 OSI 승인 오픈소스로 표시할 수 없다.
    disposition: README·CHARTER·LICENSE에 소스 공개형과 비승인 상태를 명시한다.
  - source: existing MIT and GNU AGPL permissions
    text: 파일 교체로 이미 부여한 권리와 타 저장소의 라이선스를 소급 변경할 수 없다.
    disposition: MIT 전문 보존 및 신규 권리 범위에 한정한다.
